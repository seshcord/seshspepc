# This file is going to look slightly screwball. It contains what looks like
# HTML-over-YAML, but is actually a combination of Markdown (in pseudo-HTML, as
# accepted by ts-markdown), and data that can be used to both render wiki
# entries and generate code for the various seshcord libraries and tools.
#
# This file contains a series of dictionary objects, presented in order they
# should appear in the wiki entry. Some of these are markdown that should be
# rendered into the wiki, and some are "machine-readable" definitions of stuff
# that will be both rendered into wiki entries, and read by code-generating
# code. Since every section is a toplevel dict, the latter entries can easily
# be plucked out of the tree by the appropriate parsers.
#
# The wiki-generator(s) will process these sections in order, pasting in the
# markdown sections unchanged, and rendering the 'code' sections in whatever
# format is appropriate for that section.

# -------------------------------------------------- 

# The main wiki entry heading
header:
  - h1: Seshcord Wire Protocol

# -------------------------------------------------- 

# Basic data types
types_preamble: # The markdown preample
  - h2: Basic Data Types
  - p: "The following definitions shall be used to denote basic physical data formats:"

types: # The actual types definition
  int8:
    desc: Signed, two's complement 8-bit integer
    c: uint8_t
  uint8:
    desc: As above, but unsigned
    c: uint8_t
  int16:
    desc: Signed, two's complement, big-endian 16-bit integer
    c: int16_t
  uint16:
    desc: As above, but unsigned
    c: uint16_t
  int32:
    desc: As above, but 32-bit
    c: int32_t
  uint32:
    desc: As above, but unsigned
    c: uint32_t
  int64:
    desc: As above, but 64-bit
    c: int64_t
  uint64:
    desc: As above, but unsigned
    c: uint64_t
  int128:
    desc: As above, but 128-bit
    c: int128_t
  uint128:
    desc: As above, but unsigned
    c: uint128_t
  str:
    desc: "Null-terminated UTF-8 encoded string"
    c: "char *"
  time:
    desc: A uint64 Unix timestamp
    c: uint64_t
  uuid:
    desc: A uint128 UUID
    c: uint128_t
  binary:
    desc: Arbitrary binary data. The element immediately preceeding this element must be an integer, representing the size in bytes.
    c: "char *"
  list:
    desc: A series of elements that may appear zero or more times. The element immediately preceeding this element must be an integer, representing the number of elements.

# Packet structures

packets_preample: # The markdown heading
  - h2: Wire Protocol
  - p: Seshcord runs over TCP, optionally over SSL.
  - p: Seshcord data will be sent between client and server as a stream of packets. Each packet describes exatly one C->S or S->C event.
  - p: "The packets have the following format:"
  - ul:
    - 4 ASCII characters 'SPKT' (clean 4 bytes)
    - Payload size (uint32)
    - Packet type (int16)
    - Sequence id (uint16)
    - Payload, if payload size non-zero. The format of the payload depends on the packet type.
  - h2: Packet Specification
  - p:
    - "The packet specification defines all packets understood by Seshcord, and their structure. The formal specification lives in the "
    - link:
        href: ../blob/main/packets.yaml
        text: packets.yaml
    - " file in the spec repo. This file is used to generate the [[Wiki entry|Packets]], as well as relevant code, through the use of scripts."
 

packets: # The definition
  server: # Serer-to-client
    SESHCORD_SV_ERR:
      id: -1
      desc: previous C->S packet had error
      fields:
      - name: id
        type: uint16
        desc: sequence ID of faulted packet
    SESHCORD_SV_MSG:
      id: 0
      desc: message sent or editted
      fields:
      - name: id
        type: uuid
        desc: message ID of this message (if it's an existing message, the client treats it as an edit)
      - name: chat
        type: uuid
        desc: uuid of chat, or user in case of dm
      - name: sender
        type: uuid
        desc: user ID who sent the message
      - name: content
        type: str
        desc: message content
      - name: attachCount
        type: uint8
        desc: Number of attachments
      - name: attachments
        type: list
        desc: Attachments connection status (if non-secure, http, else https), server domain name, etc
        children:
        - name: filename
          type: str
          desc: Filename
        - name: size
          type: uint32
          desc: File size
        - name: path
          type: str
          desc: CDN file path; client constructs web link based on secure
    SESHCORD_SV_MSG_DEL:
      id: 1
      desc: message was deleted
      fields:
      - name: id
        type: uuid
        desc: Message ID
      - name: by
        type: uuid
        desc: Deletor (may be original user, or mod)
    SESHCORD_SV_FRIEND_REQ:
      id: 2
      desc: client got a friend request
      fields:
      - name: id
        type: uuid
        desc: Requestor
  client: # Client-to-server
    SESHCORD_CL_ERROR:
      id: -1
      desc: previous S->C packet had error
      fields:
      - name: sid
        type: uint16
        desc: sequence ID of faulted packet
    SESHCORD_CL_HANDSHAKE_INIT:
      id: 0
      desc: client wants to initialize a connection to the server
      fields:
      - name: clientName
        type: str
        desc: Client name
      - name: clientVer
        type: str
        desc: Client version
      - name: hostInfo
        type: struct
        desc: Host system info (non-identifiable)
        children:
        - name: cpuArch
          type: str
          desc: CPU architecture
        - name: os
          type: str
          desc: Operating system name and approximate version (e.g. Windows 10)
        - name: deviceModel
          type: str
          desc: Device model name
    SESHCORD_CL_AUTH_REGISTER:
      id: 1
      desc: client wants to create a new account
      fields:
      - name: username
        type: str
        desc: Username
      - name: email
        type: str
        desc: EMail
      - name: password
        type: str
        desc: Password (hashed)
      - name: antiSpam
        type: str
        desc: anti-spam check value if applicable (captcha?)

    SESHCORD_CL_AUTH_LOGIN:
      id: 2
      desc: client wants to log in to an existing account
      fields:
      - name: username
        type: str
        desc: username or email
      - name: password
        type: str
        desc: Password (hashed)
      - name: antiSpam
        type: str
        desc: as above
    SESHCORD_CL_SEND_MSG:
      id: 3
      desc: Message sent from client
      fields:
      - name: chat
        type: uuid
        desc: Chat or user to send message to
      - name: content
        type: str
        desc: Message text
      - name: attachCount
        type: uint8
        desc: Number of attachments
      - name: attachments
        type: list
        desc: Attachments
        children:
        - name: filename
          type: str
          desc: Filename
        - name: size
          type: uint32
          desc: File size
        - name: data
          type: binary
          desc: The attachment itself.
    SESHCORD_CL_GET_SERVERS:
      id: 4
      desc: client wants to get list of joined servers
    SESHCORD_CL_GET_DMS:
      id: 5
      desc: client wants to get list of DMs
      fields:
      - name: since
        type: time
        desc: How far back to retrieve DMs
    SESHCORD_CL_GET_FRIENDS:
      id: 6
      desc: client wants to get list of friends
